# Netlify config (S3, deploy-mvp) — SPA + same-origin API proxy.
# The web app calls /api/v1 relative to its own origin; proxying it to
# the API host keeps CORS unnecessary and CSP `connect-src 'self'` valid.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @tfm/web build"
  publish = "apps/web/dist"

# API proxy — replace API_HOST with the real service hostname once the
# Render service exists (e.g. https://tfm-api.onrender.com). Netlify does
# NOT expand env vars in redirects; the host must be literal here.
[[redirects]]
  from = "/api/*"
  to = "https://API_HOST/api/:splat"
  status = 200
  force = true
  headers = { X-From = "Netlify" }

# SPA fallback — every non-file, non-/api route serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers come from apps/web/public/_headers (Netlify honors it
# natively); keep netlify.toml free of a duplicate header config.
